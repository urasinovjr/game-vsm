name: game_vsm_app
description: Android-приложение для учебных смен проводника ВСМ
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/train-banner.jpg
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
