services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gamevsm
      POSTGRES_USER: gamevsm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - gamevsm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamevsm"]
      interval: 3s
      timeout: 3s
      retries: 20
  game:
    build: .
    ports:
      - "${GAME_BIND_ADDRESS:-127.0.0.1}:8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://gamevsm:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/gamevsm
    depends_on:
      db:
        condition: service_healthy
volumes:
  gamevsm-db:
