[project]
name = "gamevsm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]>=0.115,<1", "sqlmodel>=0.0.24,<0.1", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.fastapi]
entrypoint = "server.app:app"

[tool.pytest.ini_options]
testpaths = ["server/tests"]

[tool.ruff]
line-length = 100
